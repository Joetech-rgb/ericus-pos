{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password - {{ site_shop.name|default:"Adjeis God First Ventures" }}</title>
<style>
  * { box-sizing: border-box; }
  html { height: auto; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
    padding: 14px 12px; overflow-y: auto; font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    background:
      linear-gradient(rgba(6, 30, 20, .45), rgba(6, 30, 20, .70)),
      url('{% static "img/login_bg.jpg" %}') center / cover no-repeat fixed,
      url('{% static "img/login_bg_default.svg" %}') center / cover no-repeat fixed,
      #0b2a1b;
  }
  .card { margin: auto; width: 100%; max-width: 420px; background: rgba(255, 255, 255, .96); border-radius: 18px;
    padding: 26px 30px 22px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
  h1 { margin: 0 0 4px; font-size: 21px; text-align: center; color: #12372a; }
  .sub { text-align: center; color: #5b6b66; font-size: 14px; margin-bottom: 16px; line-height: 1.4; }
  label { display: block; font-weight: 700; font-size: 13px; margin: 12px 0 5px; color: #26443a; }
  input { width: 100%; padding: 12px 14px; font-size: 17px; border: 2px solid #cfd8d3; border-radius: 12px; font-family: inherit; }
  input:focus { outline: none; border-color: #1c7a36; }
  .btn { display: block; width: 100%; margin-top: 20px; padding: 14px; font-size: 18px; font-weight: 700; color: #fff;
    background: #1c7a36; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; }
  .back { display: block; text-align: center; margin-top: 14px; color: #1c7a36; font-weight: 600; text-decoration: none; }
  .error { background: #fff0f0; border: 1px solid #ffcccc; border-left: 4px solid #dc3545; color: #721c24;
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 14px; line-height: 1.4; }
  .hint { font-size: 12px; color: #7a8a84; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <h1>Forgot password</h1>
  <div class="sub">Type the username, the <b>owner PIN</b>, and a new password.<br>No email is needed.</div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" autocomplete="off">
    {% csrf_token %}
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ username }}" autocapitalize="none" required {% if not username %}autofocus{% endif %}>

    <label for="pin">Owner PIN</label>
    <input type="password" id="pin" name="pin" inputmode="numeric" required {% if username %}autofocus{% endif %}>

    <label for="new_password">New password</label>
    <input type="password" id="new_password" name="new_password" required>
    <div class="hint">At least 8 characters. Not only numbers.</div>

    <label for="confirm_password">Type the new password again</label>
    <input type="password" id="confirm_password" name="confirm_password" required>

    <button type="submit" class="btn">Save new password</button>
  </form>
  <a class="back" href="{% url 'login' %}">&larr; Back to sign in</a>
</div>
</body>
</html>
